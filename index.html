<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>掌上蓬莱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: a ruled ledger (the 计划表) fills the left; a narrow altar column on the right holds the two verbs (跪下 / 值班) and the 功德榜.
   Single deliberate theme: cool paper + graphite, with the storyboard's ink code — 吕洞宾 blue, 钟离权 red, gold for a wish that just lit up. */
:root{
  color-scheme: light;
  --paper:#F3F5F2; --paper-2:#E7ECE7; --sheet:#FBFCFA;
  --ink:#262A28; --muted:#6B736E; --rule:#C3CAC4; --rule-2:#DCE1DC;
  --lv:#2F6DB5; --lv-wash:rgba(47,109,181,.10);
  --zl:#C23A2B; --zl-wash:rgba(194,58,43,.10);
  --gold:#E3A21A; --gold-wash:rgba(227,162,26,.22);
  --wanted:#3B342E;
  --f-brush:"Ma Shan Zheng","STKaiti","Kaiti SC","KaiTi","BiauKai",serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-ui:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-serif);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:20px;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}

/* ---------- ledger ---------- */
.ledger{min-width:0;display:flex;flex-direction:column;background:var(--sheet);border:1.5px solid var(--ink);box-shadow:6px 6px 0 var(--paper-2)}
.ledger-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:16px 22px 12px;border-bottom:3px double var(--ink);flex-wrap:wrap}
.ledger-head h1{margin:0;font-family:var(--f-brush);font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1;letter-spacing:.06em;text-wrap:balance}
.ledger-head h1 small{font-size:.42em;margin-left:.5em;color:var(--muted);letter-spacing:.2em}
.ledger-meta{font-family:var(--f-ui);font-size:13px;color:var(--muted);text-align:right;letter-spacing:.04em;display:grid;justify-items:end;gap:8px}
.ledger-meta b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.cols,.row{display:grid;grid-template-columns:62px 92px 108px minmax(0,1fr) 64px minmax(0,1.25fr);column-gap:12px;align-items:baseline;padding:0 22px}
.cols{font-family:var(--f-ui);font-size:12px;letter-spacing:.3em;color:var(--muted);padding-block:8px;border-bottom:1px solid var(--rule)}
.rows{flex:1;overflow-y:auto;overscroll-behavior:contain;
  background-image:repeating-linear-gradient(to bottom,transparent 0 63px,var(--rule-2) 63px 64px)}
.row{min-height:64px;padding-block:10px;box-sizing:border-box;border-bottom:1px solid var(--rule-2);position:relative;transition:background-color 1.6s ease}
.row .no{font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.row .sc{font-size:14px;color:var(--muted)}
.row .who{font-size:15px;overflow-wrap:anywhere}
.row .wish{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.row .to{display:flex;gap:4px}
.dot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;font-family:var(--f-brush);color:#fff}
.dot.z{background:var(--zl)} .dot.l{background:var(--lv)}
.row .pi{font-family:var(--f-brush);font-size:21px;line-height:1.3;overflow-wrap:anywhere}
.pi .z,.zt{color:var(--zl)} .pi .l,.lt{color:var(--lv)}
.tag-sample{font-family:var(--f-ui);font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px;font-weight:400;letter-spacing:.1em}
.row.lit{background:var(--gold-wash)}
.row.lit::before,.row.relit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold)}
.row.relit{background:var(--gold-wash)}
.row.enter{animation:drop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.row .del{display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);border:1px solid var(--zl);background:var(--sheet);color:var(--zl);border-radius:4px;font-family:var(--f-ui);font-size:12px;padding:2px 8px}
.deleting .row .del{display:block}
.empty{padding:48px 22px;color:var(--muted);font-family:var(--f-ui)}

/* ---------- altar column ---------- */
.altar{min-width:0;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.booth{font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;color:var(--muted);line-height:1.5}
.booth b{display:block;font-family:var(--f-brush);font-weight:400;font-size:22px;letter-spacing:.04em;color:var(--ink)}
.verb{display:grid;gap:4px;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);padding:16px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.verb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.verb .big{font-family:var(--f-brush);font-size:40px;line-height:1.05}
.verb .sub{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.verb.kneel{background:var(--ink);color:var(--sheet);box-shadow:4px 4px 0 var(--gold)}
.verb.kneel .sub{color:#C9CFCA}
.verb.kneel .big::after{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);margin-left:12px;vertical-align:middle;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.board{border-top:3px double var(--ink);padding-top:10px}
.board h2{margin:0 0 6px;font-family:var(--f-brush);font-weight:400;font-size:28px;display:flex;justify-content:space-between;align-items:baseline}
.board h2 span{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.1em}
.board ol{list-style:none;margin:0;padding:0;display:grid}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--rule)}
.board li .rk{font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.board li:nth-child(1) .rk{color:var(--gold);font-weight:700}
.board li .nm{overflow-wrap:anywhere}
.board li .nm small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.board li .sc{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-weight:700}
.board li.me{background:var(--gold-wash)}
.board .none{color:var(--muted);font-family:var(--f-ui);font-size:13px;padding:8px 0}
.foot{margin-top:auto;display:flex;justify-content:flex-end;align-items:center;gap:12px}
.snd{border:1.5px solid var(--ink);background:var(--sheet);font-family:var(--f-ui);font-size:13px;padding:6px 12px;letter-spacing:.08em}
.snd[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tool{border:1.5px solid var(--ink);background:var(--sheet);font-family:var(--f-ui);font-size:13px;padding:6px 12px;letter-spacing:.08em}
.tool.armed{border-color:var(--zl);color:var(--zl)}
.kp .arch-h{margin-top:8px;color:var(--ink);font-weight:600}
.keeper{border:none;background:none;font-family:var(--f-ui);font-size:11px;color:var(--rule);padding:4px}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;z-index:20;background:rgba(38,42,40,.42);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);width:min(640px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;padding:24px 26px;position:relative}
.card h3{margin:0 0 4px;font-family:var(--f-brush);font-weight:400;font-size:36px;line-height:1.1}
.card .lead{margin:0 0 18px;color:var(--muted);font-family:var(--f-ui);font-size:14px}
.x{position:absolute;right:12px;top:10px;border:none;background:none;font-size:26px;color:var(--muted);padding:4px 10px}
.step-label{font-family:var(--f-ui);font-size:12px;letter-spacing:.25em;color:var(--muted);margin:14px 0 8px}
.gods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.god{border:1.5px solid var(--rule);background:var(--sheet);padding:12px 8px;display:grid;justify-items:center;align-content:center;gap:2px}
.god .gn{font-family:var(--f-brush);font-size:26px;line-height:1.1}
.god small{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.god[data-to="z"] .gn{color:var(--zl)} .god[data-to="l"] .gn{color:var(--lv)}
.god[aria-pressed="true"][data-to="z"]{border-color:var(--zl);background:var(--zl-wash)}
.god[aria-pressed="true"][data-to="l"]{border-color:var(--lv);background:var(--lv-wash)}
.god[aria-pressed="true"][data-to="b"]{border-color:var(--ink);background:var(--paper-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--sheet);padding:7px 14px;border-radius:999px;font-size:16px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.field{display:grid;gap:6px;margin-top:12px}
.field label{font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;color:var(--muted)}
.field input{font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:0;min-width:0}
.field input:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.go{margin-top:20px;width:100%;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);font-family:var(--f-brush);font-size:30px;padding:10px;box-shadow:4px 4px 0 var(--gold)}
.go:disabled{opacity:.35;cursor:not-allowed}
.go.ghost{background:var(--sheet);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}

/* receipt */
.receipt{text-align:left}
.receipt .slipno{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:8px}
.receipt .slipno b{font-family:var(--f-brush);font-size:30px;color:var(--ink);font-weight:400;letter-spacing:.05em}
.receipt .asked{font-size:24px;font-weight:900;margin:16px 0 4px}
.receipt .by{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.convo{display:grid;gap:10px;margin:18px 0 6px;padding:14px 0;border-top:3px double var(--ink);border-bottom:3px double var(--ink)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.line .sp{font-family:var(--f-ui);font-size:12px;letter-spacing:.15em;padding:1px 6px;border-radius:3px;color:#fff;white-space:nowrap}
.line .sp.z{background:var(--zl)} .line .sp.l{background:var(--lv)}
.line .tx{font-family:var(--f-brush);font-size:27px;line-height:1.35}
.line.note .tx{font-size:21px;opacity:.9}
.stamp{position:absolute;right:26px;top:70px;font-family:var(--f-brush);font-size:34px;color:var(--zl);border:3px solid var(--zl);border-radius:6px;padding:0 8px;transform:rotate(-12deg);opacity:.85;animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both;animation-delay:.2s}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.photo-hint{font-family:var(--f-ui);font-size:13px;color:var(--muted);text-align:center;margin-top:8px}

/* ---------- game ---------- */
.game{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;box-sizing:border-box}
.ghud{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:16px;align-items:center}
.back{border:1.5px solid var(--ink);background:var(--sheet);font-family:var(--f-ui);font-size:13px;padding:6px 12px;letter-spacing:.08em;white-space:nowrap}
.skip{border:none;background:none;font-family:var(--f-ui);font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:14px;justify-self:center;padding:6px}
@media (max-width:820px){.ghud{grid-template-columns:auto minmax(0,1fr) auto}.ghud .timebar{grid-column:1/-1;grid-row:3}.ghud .snd{grid-column:3;grid-row:1}.ghud .merit{grid-column:3;grid-row:2;text-align:right}.ghud .tt{grid-column:1/3;grid-row:2;font-size:26px}}
.ghud .tt{font-family:var(--f-brush);font-size:30px;line-height:1}
.timebar{height:10px;border:1.5px solid var(--ink);background:var(--sheet);position:relative;overflow:hidden}
.timebar i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(var(--t,1))}
.merit{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);text-align:right}
.merit b{display:block;font-size:30px;color:var(--ink);line-height:1}
.helpers{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:var(--f-ui);font-size:13px}
.helper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.helper .pips{display:flex;gap:4px}
.helper .pips i{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.helper .pips i.on{background:currentColor}
.helper.z{color:var(--zl)} .helper.l{color:var(--lv);justify-content:flex-end}
.helper > span:not(.pips){color:var(--muted)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}
.cell{position:relative;border:1.5px dashed var(--rule);background:var(--sheet);display:grid;place-items:center;text-align:center;padding:8px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cell .w{display:none;gap:4px;justify-items:center}
.cell.on .w{display:grid}
.cell .w .who2{font-family:var(--f-ui);font-size:12px;letter-spacing:.15em}
.cell .w .t{font-weight:900;font-size:clamp(16px,2.3vw,26px);line-height:1.2}
.cell .ring{position:absolute;left:0;bottom:0;height:5px;width:100%;transform-origin:left;transform:scaleX(var(--p,1))}
.cell.z{border:2px solid var(--zl);background:var(--zl-wash)} .cell.z .who2,.cell.z .t{color:var(--zl)} .cell.z .ring{background:var(--zl)}
.cell.l{border:2px solid var(--lv);background:var(--lv-wash)} .cell.l .who2,.cell.l .t{color:var(--lv)} .cell.l .ring{background:var(--lv)}
.cell.g{border:2px solid var(--gold);background:var(--gold-wash);animation:shimmer .5s ease-in-out infinite alternate} .cell.g .ring{background:var(--gold)}
@keyframes shimmer{to{box-shadow:inset 0 0 0 4px var(--gold-wash)}}
.cell.x{border:2px solid var(--wanted);background:repeating-linear-gradient(45deg,var(--paper-2) 0 8px,var(--sheet) 8px 16px)} .cell.x .t{color:var(--wanted);font-family:var(--f-brush);font-weight:400;font-size:clamp(24px,3vw,36px)} .cell.x .who2{color:var(--wanted)} .cell.x .ring{background:var(--wanted)}
.cell.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85)}}
.cell.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fx{position:absolute;pointer-events:none;font-family:var(--f-brush);font-size:clamp(34px,5vw,58px);animation:fx .7s ease-out forwards}
@keyframes fx{0%{transform:scale(1.8) rotate(-10deg);opacity:0}25%{transform:scale(1) rotate(-10deg);opacity:1}100%{transform:translateY(-18px) rotate(-10deg);opacity:0}}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--sheet);border:1.5px solid currentColor;box-shadow:5px 5px 0 currentColor;padding:12px 20px;font-family:var(--f-brush);font-size:clamp(24px,3.4vw,38px);white-space:nowrap;max-width:92%;z-index:5;animation:toast 1.8s ease forwards;pointer-events:none}
.toast small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%)}12%,80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-60%)}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-brush);font-size:min(30vw,220px);color:var(--ink);background:rgba(243,245,242,.82);z-index:6}
.result h3{font-size:44px}
.result .score{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:64px;font-weight:800;line-height:1}
.result .title{font-family:var(--f-brush);font-size:34px;color:var(--gold);margin:4px 0 10px}
.result .stats{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.result .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* keeper panel */
.kp{display:grid;gap:10px}
.kp button{border:1.5px solid var(--ink);background:var(--sheet);padding:10px;text-align:left;font-family:var(--f-ui);font-size:15px}
.kp button.warn{border-color:var(--zl);color:var(--zl)}
.kp p{margin:0;font-family:var(--f-ui);font-size:13px;color:var(--muted)}

@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr)}
  .altar{order:-1;overflow:visible}
  .ledger{min-height:70vh}
  .cols{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding:10px 16px}
  .row .no{grid-column:1;grid-row:1}
  .row .to{grid-column:2;grid-row:1;justify-self:end}
  .row .sc{display:none}
  .row .who{grid-column:1/-1;font-size:13px;color:var(--muted)}
  .row .wish,.row .pi{grid-column:1/-1}
  .rows{background-image:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
  .gods{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .helpers{grid-template-columns:1fr}
  .helper.l{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div class="app" id="app">
  <section class="ledger" aria-label="计划表">
    <header class="ledger-head">
      <h1>掌上蓬莱<small>人神共处 · 有求必应</small></h1>
      <div class="ledger-meta"><div class="tools"><button class="tool" id="btnArch">归档数据</button><button class="snd" id="btnSnd" aria-pressed="false">声音 · 关</button></div><div>今日已有 <b id="nKneel">0</b> 位信众跪下<br><span id="nowSc">—</span></div></div>
    </header>
    <div class="cols" aria-hidden="true"><span>签号</span><span>时辰</span><span>信众</span><span>所愿</span><span>求</span><span>批</span></div>
    <div class="rows" id="rows"></div>
  </section>

/* ================= sound: all synthesized in the browser (no files, works offline) ================= */
const SND=(()=>{
  let ctx=null,sfx,bgm,on=false,busy=false,timer=null,nextT=0,step=0,last=8;
  const cache=new Map();
  const P=i=>{const o=Math.floor(i/5),k=((i%5)+5)%5;return 146.83*Math.pow(2,(12*o+[0,2,4,7,9][k])/12);}; // D 宫 pentatonic
  function init(){
    if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();const master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    const conv=ctx.createConvolver(),r=ctx.sampleRate,len=r*2.2,ib=ctx.createBuffer(2,len,r);
    for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    conv.buffer=ib;const wet=ctx.createGain();wet.gain.value=.25;conv.connect(wet);wet.connect(master);
    sfx=ctx.createGain();sfx.gain.value=.7;sfx.connect(master);sfx.connect(conv);
    bgm=ctx.createGain();bgm.gain.value=.15;bgm.connect(master);bgm.connect(conv);
  }
  function ks(freq){ // plucked string (Karplus–Strong), reads a little like 古筝
    const key=freq.toFixed(1);if(cache.has(key))return cache.get(key);
    const r=ctx.sampleRate,len=Math.floor(r*2.2),buf=ctx.createBuffer(1,len,r),d=buf.getChannelData(0);
    const N=Math.max(2,Math.round(r/freq)),line=new Float32Array(N);for(let i=0;i<N;i++)line[i]=Math.random()*2-1;
    let idx=0;for(let i=0;i<len;i++){const cur=line[idx],nx=line[(idx+1)%N];line[idx]=.997*.5*(cur+nx);d[i]=cur;idx=(idx+1)%N;}
    cache.set(key,buf);return buf;
  }
  function pluck(f,t,g,dest){const s=ctx.createBufferSource();s.buffer=ks(f);const gn=ctx.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+2.1);s.connect(gn);gn.connect(dest||sfx);s.start(t);s.stop(t+2.2);}
  function tone(type,f0,f1,t,dur,g){const o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+.005);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(sfx);o.start(t);o.stop(t+dur+.05);}
  function noise(t,dur,g,freq,q,type){const len=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;const gn=ctx.createGain();gn.gain.value=g;s.connect(f);f.connect(gn);gn.connect(sfx);s.start(t);}
  function bell(f,t,g,dur){[[1,1],[2.76,.5],[5.4,.25],[8.93,.12]].forEach(([r,a])=>tone('sine',f*r,0,t,dur/(1+r*.3),g*a));} // 磬
  function sched(){
    if(!on||!ctx)return;
    while(nextT<ctx.currentTime+.35){
      const sd=busy?.21:.42;
      if(step%16===0)pluck(P([0,3,4,2][(step/16)%4|0]),nextT,.34,bgm);
      if(Math.random()<(busy?.72:.5)){last=Math.min(13,Math.max(5,last+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));pluck(P(last),nextT,.26,bgm);}
      step++;nextT+=sd;
    }
  }
  const fx=f=>(...a)=>{if(on&&ctx)f(ctx.currentTime+.01,...a);};
  return {
    get on(){return on},
    set(v){on=v;if(v){init();if(!ctx)return;ctx.resume();nextT=ctx.currentTime+.15;if(!timer)timer=setInterval(sched,100);}else if(ctx)ctx.suspend();},
    busy(v){busy=v;},
    wake(){if(!on)return;init();if(ctx&&ctx.state!=='running')ctx.resume();},
    pick:fx(t=>pluck(P(7+(Math.random()*5|0)),t,.3)),
    light:fx(t=>{bell(587,t,.22,3.5);bell(880,t+.18,.12,2.5);}),
    stamp:fx(t=>{tone('sine',140,55,t,.18,.7);noise(t,.06,.5,400,1,'lowpass');}),
    wood:fx(t=>{tone('sine',720,520,t,.09,.55);noise(t,.02,.35,1500,6);}),
    gold:fx(t=>{bell(1175,t,.18,1.4);pluck(P(14),t,.25);}),
    wrong:fx(t=>{tone('triangle',220,110,t,.25,.35);tone('square',233,0,t,.12,.05);}),
    miss:fx(t=>tone('sine',180,140,t,.2,.2)),
    combo:fx(t=>[10,11,12,13,15].forEach((n,i)=>pluck(P(n),t+i*.07,.3))),
    tick:fx(t=>{tone('sine',1400,0,t,.06,.3);noise(t,.03,.3,2000,4);}),
    go:fx(t=>bell(784,t,.22,1.2)),
    gong:fx(t=>{bell(98,t,.4,5);tone('sine',98,92,t,4,.25);})
  };
})();

/* ================= storage ================= */
const KEY={w:'penglai.wishes.v2',b:'penglai.board.v1',n:'penglai.seq.v1'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let wishes=load(KEY.w,null), board=load(KEY.b,[]), seq=load(KEY.n,0);

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SC='子丑寅卯辰巳午未申酉戌亥', KE=['','一','二','三','四','五','六','七','八'];
function shichen(d){const h=d.getHours(),m=d.getMinutes(),i=Math.floor(((h+1)%24)/2),start=(i*2+23)%24;const mins=((h-start+24)%24)*60+m;return SC[i]+'时'+KE[Math.min(8,Math.floor(mins/15)+1)]+'刻';}
const pad=n=>String(n).padStart(3,'0');

function makeReply(to,cat){
  const L=LINES[cat]||LINES.custom;
  if(to==='b'){const sp=DUO_BY[cat]||[];const pool=sp.length&&Math.random()<.6?sp:DUO;return {lines:pick(pool).map(([w,t])=>({w,t}))};}
  const r={lines:[{w:to,t:pick(L[to])}]};
  if(Math.random()<.3){const o=to==='z'?'l':'z';r.note={w:o,t:pick(NOTE[o])};}
  return r;
}
function makeSamples(){ // example rows, clearly marked
  const now=Date.now();
  return SAMPLES.map((s,i)=>{const d=new Date(now-(SAMPLES.length-i)*23*60000);return {id:'s'+i,no:0,sc:shichen(d),name:s.name,text:s.text,to:s.to,cat:s.cat,...makeReply(s.to,s.cat),sample:true};}).reverse();
}
if(!wishes){
  wishes=makeSamples();
  save(KEY.w,wishes);
}

/* ================= ledger ================= */
const rowsEl=$('#rows');
function piHTML(w){
  const first=w.lines[w.lines.length-1];
  const lead=w.to==='b'?w.lines.map(x=>`<span class="${x.w}">${esc(x.t)}</span>`).slice(-2).join(' '):`<span class="${first.w}">${esc(first.t)}</span>`;
  return lead;
}
function dots(to){return to==='b'?'<i class="dot z">钟</i><i class="dot l">吕</i>':`<i class="dot ${to}">${to==='z'?'钟':'吕'}</i>`;}
function rowHTML(w){
  return `<div class="row" data-id="${w.id}">
    <span class="no">${w.sample?'——':'第'+pad(w.no)}</span>
    <span class="sc">${esc(w.sc)}</span>
    <span class="who">${esc(w.name)}</span>
    <span class="wish">${esc(w.text)}${w.sample?'<span class="tag-sample">示例</span>':''}</span>
    <span class="to">${dots(w.to)}</span>
    <span class="pi">${piHTML(w)}</span>
    <button class="del" data-del="${w.id}">删去</button></div>`;
}
function renderRows(){
  rowsEl.innerHTML=wishes.length?wishes.map(rowHTML).join(''):'<div class="empty">计划表还空着。第一位跪下的信众，愿望会亮在这里。</div>';
  $('#nKneel').textContent=wishes.filter(w=>!w.sample).length;
}
rowsEl.addEventListener('click',e=>{const id=e.target.dataset?.del;if(!id)return;wishes=wishes.filter(w=>w.id!==id);save(KEY.w,wishes);renderRows();});

function renderBoard(hiId){
  const ol=$('#board');
  if(!board.length){ol.innerHTML='<li class="none" style="display:block">还没有人上榜。去替一班？</li>';return;}
  ol.innerHTML=board.slice(0,8).map((r,i)=>`<li class="${r.id===hiId?'me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(r.name)}<small>${esc(r.title)}</small></span><span class="sc">${r.score}</span></li>`).join('');
}
function tickClock(){$('#nowSc').textContent='此刻 · '+shichen(new Date());}

/* ================= idle / attract ================= */
let lastTouch=Date.now(), mode='home';
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>lastTouch=Date.now(),{passive:true}));
setInterval(()=>{
  tickClock();
  const idle=Date.now()-lastTouch;
  if(mode==='home'){
    const rs=[...rowsEl.querySelectorAll('.row')].slice(0,14);
    if(rs.length){const r=pick(rs);r.classList.add('relit');setTimeout(()=>r.classList.remove('relit'),2600);}
  } else if(mode!=='game' && idle>60000){closeLayer();}
},4200);

/* ================= overlays ================= */
const layer=$('#layer');
function openLayer(html,m){layer.innerHTML=html;mode=m;lastTouch=Date.now();}
function closeLayer(){layer.innerHTML='';mode='home';SND.busy(false);}
layer.addEventListener('click',e=>{if(e.target.matches('.veil:not(.hold)')||e.target.closest('[data-close]'))closeLayer();});

      <div class="field"><label for="wName">署名</label><input id="wName" maxlength="8" placeholder="某信众"></div>
    </div>
    <button class="go" id="wGo" disabled>叩首</button>
  </form></div>`,'wish');
  const f=$('#wf'),go=$('#wGo'),txt=$('#wText');
  const check=()=>go.disabled=!(st.to&&txt.value.trim());
  f.querySelectorAll('.god').forEach(b=>b.onclick=()=>{st.to=b.dataset.to;f.querySelectorAll('.god').forEach(x=>x.setAttribute('aria-pressed',x===b));SND.pick();check();});
  f.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.cat=b.dataset.cat;f.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));SND.wood();
    if(st.cat==='custom'){txt.value='';txt.focus();}else txt.value=b.textContent;check();});
  txt.oninput=check;
  f.onsubmit=e=>{e.preventDefault();if(go.disabled)return;
    const cat=st.cat||'custom';
    seq+=1;save(KEY.n,seq);
    const w={id:'w'+Date.now(),no:seq,sc:shichen(new Date()),name:$('#wName').value.trim()||'某信众',text:txt.value.trim(),to:st.to,cat,...makeReply(st.to,cat)};
    wishes.unshift(w);save(KEY.w,wishes);closeLayer();lightUp(w);
  };
};
function lightUp(w){
  SND.light();
  mode='lighting';
  renderRows();rowsEl.scrollTop=0;
  const r=rowsEl.firstElementChild;r.classList.add('enter','lit');
  const pi=r.querySelector('.pi');const full=pi.innerHTML;pi.innerHTML='';
  setTimeout(()=>{pi.innerHTML=full;pi.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:900,easing:'steps(12,end)'});},800);
  setTimeout(()=>{showReceipt(w);setTimeout(SND.stamp,450);},2100);
  setTimeout(()=>r.classList.remove('lit'),9000);
}
function showReceipt(w){
  const lines=w.lines.map(x=>`<div class="line"><span class="sp ${x.w}">${NAME[x.w]}</span><span class="tx ${x.w}t">${esc(x.t)}</span></div>`).join('')
    +(w.note?`<div class="line note"><span class="sp ${w.note.w}">${NAME[w.note.w]}</span><span class="tx ${w.note.w}t">${esc(w.note.t)}</span></div>`:'');
  openLayer(`<div class="veil"><div class="card receipt">
    <div class="slipno"><span>掌上蓬莱 · 回执</span><b>第${pad(w.no)}签</b></div>
    <div class="stamp">已批</div>
    <div class="asked">「${esc(w.text)}」</div>
    <div class="by">${esc(w.name)} · ${esc(w.sc)} · 求${w.to==='b'?'二位':NAME[w.to]}</div>
    <div class="convo">${lines}</div>
    <button class="go ghost" data-close>收好了</button>
  </div></div>`,'receipt');
}

/* ---------- 值班三十息 ---------- */
$('#btnDuty').onclick=startGame;
function startGame(){
  openLayer(`<div class="game" id="game">
    <div class="ghud"><button class="back" id="gBack">← 回计划表</button><span class="tt">替班三十息</span><div class="timebar"><i id="tb"></i></div><div class="merit">功德<b id="gm">0</b></div><button class="snd" id="gSnd" aria-pressed="false">声音 · 关</button></div>
    <div class="helpers">
      <div class="helper z"><b>钟离权的愿</b><span class="pips" id="pz"></span><span>清满五条，洞宾来帮</span></div>
      <div class="helper l"><span>清满五条，师兄来帮</span><span class="pips" id="pl"></span><b>吕洞宾的愿</b></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="count" id="cd">三</div>
  </div>`,'game');
  const game=$('#game'),grid=$('#grid'),N=12,DUR=30000;
  const cells=[];for(let i=0;i<N;i++){const c=document.createElement('div');c.className='cell';c.innerHTML='<div class="w"><span class="who2"></span><span class="t"></span></div><i class="ring"></i>';grid.appendChild(c);cells.push({el:c,type:null});}
  const S={score:0,cleared:0,missed:0,wrong:0,pz:0,pl:0,t0:0,next:0,raf:0,done:false};
  const pips=()=>{['z','l'].forEach(k=>$('#p'+k).innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<S['p'+k]?'on':''}"></i>`).join(''));};
  pips();
  const addScore=n=>{S.score=Math.max(0,S.score+n);$('#gm').textContent=S.score;};
  function fx(cell,txt,color){const r=cell.el.getBoundingClientRect(),g=game.getBoundingClientRect();const s=document.createElement('span');s.className='fx';s.textContent=txt;s.style.color=color;s.style.left=(r.left-g.left+r.width/2-30)+'px';s.style.top=(r.top-g.top+r.height/2-36)+'px';game.appendChild(s);setTimeout(()=>s.remove(),700);}
  function toast(who,line){const t=document.createElement('div');t.className='toast';t.style.color=who==='z'?'var(--zl)':'var(--lv)';t.innerHTML=`<small>${NAME[who]}</small>${esc(line)}`;game.appendChild(t);setTimeout(()=>t.remove(),1800);}
  function clear(c){c.type=null;c.el.className='cell';}
  function spawn(now,elapsed){
    const free=cells.filter(c=>!c.type);if(!free.length)return;
    const c=pick(free),r=Math.random();
    const type=r<.38?'z':r<.76?'l':r<.87?'g':'x';
    const life=(type==='g'?1400:type==='x'?2300:2900)-elapsed*0.025;
    c.type=type;c.born=now;c.life=life;
    c.el.className='cell on pop '+type;
    c.el.querySelector('.who2').textContent=type==='z'?'求 · 钟离':type==='l'?'求 · 洞宾':type==='g'?'急愿':'勿批';
    c.el.querySelector('.t').textContent=type==='x'?'通缉令':pick(GAME_WISHES);
  }
  function helper(k){ // k = colour that hit five; the other one clears all of k
    SND.combo();
    const C=COMBO[k];S['p'+k]=0;pips();toast(C.by,pick(C.lines));
    cells.forEach(c=>{if(c.type===k){addScore(10);S.cleared++;fx(c,'批',k==='z'?'var(--lv)':'var(--zl)');clear(c);}});
  }
  cells.forEach(c=>c.el.addEventListener('pointerdown',e=>{
    e.preventDefault();if(S.done||!S.t0||!c.type||c.type==='dead')return;
    const t=c.type;
    if(t==='x'){SND.wrong();addScore(-15);S.wrong++;c.el.classList.remove('pop');void c.el.offsetWidth;c.el.classList.add('shake');fx(c,'抓错','var(--wanted)');setTimeout(()=>clear(c),300);c.type='dead';return;}
    if(t==='g')SND.gold();else SND.wood();const pts=t==='g'?30:10;addScore(pts);S.cleared++;
    fx(c,t==='g'?'+30':'批',t==='z'?'var(--zl)':t==='l'?'var(--lv)':'var(--gold)');clear(c);
    if(t==='z'||t==='l'){S['p'+t]++;pips();if(S['p'+t]>=5)helper(t);}
  }));
  function loop(now){
    if(S.done)return;
    const el=now-S.t0;$('#tb').style.setProperty('--t',Math.max(0,1-el/DUR));
    if(now>=S.next){spawn(now,el);S.next=now+Math.max(380,880-el*0.017)+Math.random()*180;}
    cells.forEach(c=>{if(!c.type||c.type==='dead')return;const p=1-(now-c.born)/c.life;c.el.style.setProperty('--p',Math.max(0,p));
      if(p<=0){if(c.type==='z'||c.type==='l'){SND.miss();addScore(-3);S.missed++;S['p'+c.type]=0;pips();fx(c,'误','var(--muted)');}clear(c);}});
    if(el>=DUR){finish();return;}
    S.raf=requestAnimationFrame(loop);
  }
  const cd=$('#cd');let n=3;SND.busy(true);SND.tick();const tick=setInterval(()=>{n--;if(n>0){cd.textContent='三二一'[3-n];SND.tick();}else{clearInterval(tick);SND.go();cd.remove();S.t0=performance.now();S.next=S.t0;S.raf=requestAnimationFrame(loop);}},700);
  $('#gBack').onclick=()=>{S.done=true;clearInterval(tick);cancelAnimationFrame(S.raf);closeLayer();};
  function finish(){
    S.done=true;SND.busy(false);SND.gong();cancelAnimationFrame(S.raf);
    const title=rankTitle(S.score);
    const g=document.createElement('div');g.className='veil hold';mode='result';
    g.innerHTML=`<form class="card result" id="rf" autocomplete="off">
      <h3>下班了。</h3>
      <div class="score">${S.score}</div><div class="title">${title}</div>
      <div class="stats"><span>批了 <b>${S.cleared}</b> 条</span><span>误了 <b>${S.missed}</b> 条</span><span>抓错 <b>${S.wrong}</b> 回</span></div>
      <div class="field"><label for="rName">在功德榜上留名</label><input id="rName" maxlength="8" placeholder="某散仙"></div>
      <div class="btnrow"><button class="go" type="submit">上榜</button><button class="go ghost" type="button" id="again">再替一班</button></div>
      <button class="skip" type="button" id="skip">不留名，回计划表</button>
    </form>`;
    game.appendChild(g);
    g.querySelector('#again').onclick=startGame;
    g.querySelector('#skip').onclick=closeLayer;
    g.querySelector('#rf').onsubmit=e=>{e.preventDefault();
      const id='r'+Date.now();board.push({id,name:$('#rName').value.trim()||'某散仙',score:S.score,title});
      board.sort((a,b)=>b.score-a.score);board=board.slice(0,50);save(KEY.b,board);
      closeLayer();renderBoard(id);setTimeout(()=>renderBoard(),12000);
    };
  }
}

/* ---------- 摊主 ---------- */
$('#btnKeeper').onclick=()=>{
  openLayer(`<div class="veil"><div class="card">
    <button class="x" data-close aria-label="关闭">×</button>
    <h3>摊主设置</h3><p class="lead">数据只存在这台设备的浏览器里。</p>
    <div class="kp">
      <button id="kDel">${document.body.classList.contains('deleting')?'关闭':'打开'}删条目模式（愿望写得不合适时用）</button>
      <button id="kSample">移除示例条目</button>
      <button id="kFull">全屏</button>
      <button class="warn" id="kWipe">清空计划表和签号</button>
      <button class="warn" id="kBoard">清空功德榜</button>
      <p id="kMsg"></p>
      <div class="kp" id="kArch"></div>
    </div></div></div>`,'keeper');
  const msg=t=>$('#kMsg').textContent=t;
  $('#kDel').onclick=()=>{document.body.classList.toggle('deleting');closeLayer();};
  $('#kSample').onclick=()=>{wishes=wishes.filter(w=>!w.sample);save(KEY.w,wishes);renderRows();msg('示例已移除。');};
  $('#kFull').onclick=()=>{const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.reject()).catch(()=>msg('这台设备不支持网页全屏。iPad 可以用“添加到主屏幕”打开。'));};
  const twice=(btn,fn)=>{let armed=false;btn.onclick=()=>{if(!armed){armed=true;btn.textContent='再点一次确认';setTimeout(()=>armed=false,3000);return;}fn();};};
  twice($('#kWipe'),()=>{wishes=[];seq=0;save(KEY.w,wishes);save(KEY.n,0);renderRows();msg('计划表已清空，签号从 001 重新开始。');});
  twice($('#kBoard'),()=>{board=[];save(KEY.b,board);renderBoard();msg('功德榜已清空。');});
  const drawArch=()=>{const box=$('#kArch');if(!box)return;
    box.innerHTML='<p class="arch-h">归档记录</p>'+(archives.length?archives.map((a,i)=>`<button data-ri="${i}">恢复 · ${new Date(a.at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${a.wishes.length} 条愿望 · ${a.board.length} 人上榜</button>`).join('')+'<p>恢复时，当前的数据会先自动归档，不会丢。</p>':'<p>还没有归档过。</p>');
    box.querySelectorAll('[data-ri]').forEach(b=>twice(b,()=>{restoreArchive(+b.dataset.ri);drawArch();msg('已恢复。');}));};
  drawArch();
};

/* archive: puts current wishes + 功德榜 aside (kept on this device) and starts fresh with the example rows */
const AKEY='penglai.archive.v1';let archives=load(AKEY,[]);
const hasData=()=>wishes.some(w=>!w.sample)||board.length>0;
function archiveNow(){
  if(!hasData())return false;
  archives.unshift({at:Date.now(),wishes:wishes.filter(w=>!w.sample),board,seq});save(AKEY,archives);
  wishes=makeSamples();board=[];seq=0;save(KEY.w,wishes);save(KEY.b,board);save(KEY.n,seq);renderRows();renderBoard();return true;
}
function restoreArchive(i){
  const a=archives.splice(i,1)[0];if(!a)return;save(AKEY,archives);archiveNow();
  wishes=a.wishes.length?a.wishes:makeSamples();board=a.board;seq=a.seq;save(KEY.w,wishes);save(KEY.b,board);save(KEY.n,seq);renderRows();renderBoard();
}
(()=>{const b=$('#btnArch');let armed=false,t;const reset=()=>{armed=false;b.textContent='归档数据';b.classList.remove('armed');};
  b.onclick=()=>{if(!armed){armed=true;b.textContent='再点一次确认';b.classList.add('armed');t=setTimeout(reset,3000);return;}
    clearTimeout(t);const ok=archiveNow();b.textContent=ok?'已归档':'没有可归档的';b.classList.remove('armed');setTimeout(reset,1800);};})();

/* sound toggle: remembered on this device; browsers only allow sound after a tap, so a saved 'on' waits for the first tap */
const SKEY='penglai.sound.v1';let wantSnd=load(SKEY,false);
function syncSnd(){document.querySelectorAll('.snd').forEach(b=>{b.setAttribute('aria-pressed',wantSnd);b.textContent='声音 · '+(wantSnd?'开':'关');});}
document.addEventListener('click',e=>{const b=e.target.closest('.snd');if(!b)return;wantSnd=!wantSnd;save(SKEY,wantSnd);SND.set(wantSnd);syncSnd();});
// browsers only unlock audio on a real tap (click / touchend / key), not on pointerdown, so retry on each of those until it is running
['click','touchend','pointerup','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!wantSnd)return;if(!SND.on)SND.set(true);else SND.wake();},{capture:true}));
new MutationObserver(syncSnd).observe(layer,{childList:true});
syncSnd();
renderRows();renderBoard();tickClock();
})();
</script>
